<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PABEN.ID - Wibawa dalam setiap Berita</title>
    <meta name="description" content="Wibawa dalam setiap Berita — PABEN.ID menyajikan berita faktual, terpercaya, dan terkini seputar nasional, ekonomi, olahraga, teknologi, hiburan, daerah, dan opini." />
    <meta name="keywords" content="paben, paben id, berita faktual, berita terkini, berita hari ini, portal berita" />

    <!--
      Urutan penting. Sebagian browser memakai deklarasi PNG bila ada, jadi
      favicon-32.png ditaruh setelah .ico supaya dialah yang dipakai di tab.
      Monogram Glass Bold tetap terbaca di 16px karena huruf P-nya tebal dan
      radiusnya diturunkan; .ico tetap disediakan untuk browser lama dan
      pintasan desktop.

      ?v=1 memaksa browser mengunduh ulang. Favicon disimpan di cache terpisah
      yang tidak ikut terhapus oleh hard refresh biasa, jadi tanpa penanda ini
      ikon lama bisa bertahan berhari-hari walau berkasnya sudah diganti.
      Naikkan angkanya setiap kali ikonnya berubah lagi.
    -->
    <link rel="icon" href="/favicon.ico?v=1" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-icon-512.png?v=1" />
    <meta name="theme-color" content="#170c0a" />

    <!--
      Tiga keluarga huruf identitas: Barlow (antarmuka), Barlow Condensed 800
      (wordmark & judul), Newsreader italic (tagline & kutipan). preconnect
      dipasang supaya permintaan CSS dan file woff2 tidak menunggu handshake.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&family=Newsreader:ital,wght@1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Umpan berita untuk pembaca RSS dan agregator -->
    <link rel="alternate" type="application/rss+xml" title="PABEN.ID" href="/rss.xml" />

    <!-- Open Graph (fallback default, dipakai kalau halaman/bot tidak dapat versi dinamis dari middleware) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PABEN.ID" />
    <meta property="og:title" content="PABEN.ID - Wibawa dalam setiap Berita" />
    <meta property="og:description" content="Wibawa dalam setiap Berita — PABEN.ID menyajikan berita faktual, terpercaya, dan terkini seputar nasional, ekonomi, olahraga, teknologi, hiburan, daerah, dan opini." />
    <meta property="og:image" content="https://paben.id/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://paben.id/" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PABEN.ID - Wibawa dalam setiap Berita" />
    <meta name="twitter:description" content="Wibawa dalam setiap Berita — PABEN.ID menyajikan berita faktual, terpercaya, dan terkini seputar nasional, ekonomi, olahraga, teknologi, hiburan, daerah, dan opini." />
    <meta name="twitter:image" content="https://paben.id/og-default.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
